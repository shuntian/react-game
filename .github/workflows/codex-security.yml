name: Codex Security (manual)

on:
  workflow_dispatch:
    inputs:
      run_scan:
        description: 'Send scoped source context to the OpenAI API (otherwise preflight only)'
        type: boolean
        default: false
      upload_report:
        description: 'Keep the Markdown report for 7 days; may contain source excerpts'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: codex-security-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pinned scanner outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-security" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @openai/codex-security@0.10.1

      - name: Prepare Codex sandbox on the Ubuntu runner
        if: ${{ inputs.run_scan }}
        shell: bash
        run: |
          codex="$(cd "$RUNNER_TEMP/codex-security" && node --input-type=module -e 'import { resolveCodexCommand } from "@openai/codex-security"; console.log(resolveCodexCommand().command)')"
          CODEX_HOME="$(mktemp -d "$RUNNER_TEMP/codex-sandbox-probe.XXXXXX")"
          export CODEX_HOME

          # Use the same local version probe as the SDK, without loading scan credentials.
          probe_sandbox() {
            timeout 30s "$codex" sandbox -- "$codex" --version
          }

          if ! probe_sandbox > /dev/null 2>&1; then
            # Match the official Codex Security Action's targeted Ubuntu setup.
            sudo apt-get update
            sudo apt-get install --yes bubblewrap apparmor-profiles
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [[ ! -f "$profile" ]]; then
              profile=/etc/apparmor.d/bwrap-userns-restrict
            fi
            sudo apparmor_parser -r "$profile"
            probe_sandbox
          fi

      - name: Check configuration and optionally scan src
        env:
          RUN_SCAN: ${{ inputs.run_scan }}
          UPLOAD_REPORT: ${{ inputs.upload_report }}
          OPENAI_API_KEY: ${{ inputs.run_scan && secrets.OPENAI_API_KEY || '' }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/codex-security/scan.mjs" <<'JS'
          import { appendFileSync, copyFileSync, writeSync } from 'node:fs';
          import { join } from 'node:path';

          const runScan = process.env.RUN_SCAN === 'true';
          const summarize = (message) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          // Descriptor 3 is reserved for fixed, safe annotations, not SDK output.
          const annotate = (level, message) => {
            summarize(message);
            writeSync(3, `::${level}::${message}\n`);
          };
          if (runScan && !process.env.OPENAI_API_KEY?.trim()) {
            annotate('error', 'Set the OPENAI_API_KEY Actions secret to run a live scan.');
            process.exit(1);
          }

          // Only publish fixed categories. SDK errors can embed source, paths, or credentials.
          const errorCategories = new Map([
            ['AuthenticationRequiredError', 'authentication setup required'],
            ['ConfigurationError', 'invalid SDK configuration'],
            ['CodexConnectionError', 'Codex process connection failed'],
            ['PluginBootstrapError', 'scanner startup failed'],
            ['LocalPluginBootstrapError', 'scanner plugin startup failed'],
            ['PluginPythonUnavailableError', 'scanner Python runtime unavailable'],
            ['SandboxUnavailableError', 'required scanner sandbox unavailable'],
            ['InvalidTargetError', 'invalid scan target'],
            ['OutputDirectoryError', 'invalid output directory'],
            ['OutputDirectoryNotEmptyError', 'output directory is not empty'],
            ['OutputInsideProtectedRootError', 'output or state directory overlaps the scan target'],
            ['ContractValidationError', 'scanner output did not pass validation'],
            ['ZodError', 'scanner response did not match the expected schema'],
            ['IncompleteScanError', 'scanner did not produce a complete result'],
            ['ScanInterruptedError', 'scan interrupted'],
            ['ERR_MODULE_NOT_FOUND', 'required module not found'],
            ['ENOENT', 'required file or executable not found'],
            ['EACCES', 'filesystem permission denied'],
            ['ETIMEDOUT', 'operation timed out'],
          ]);
          const httpCategories = new Map([
            [400, 'HTTP 400: invalid request'],
            [401, 'HTTP 401: authentication rejected'],
            [403, 'HTTP 403: access denied'],
            [404, 'HTTP 404: requested resource not found'],
            [429, 'HTTP 429: rate or quota limit'],
            [500, 'HTTP 500: upstream service error'],
            [502, 'HTTP 502: upstream gateway error'],
            [503, 'HTTP 503: upstream service unavailable'],
            [504, 'HTTP 504: upstream gateway timeout'],
          ]);
          // Some SDK and app-server failures wrap details in text, not a status field.
          // Match known patterns, but never publish the text or any captured value.
          const messageCategories = [
            [/^Codex API-key login failed:/u, 'Codex CLI API-key login failed'],
            [/^(?:Could not run|Could not save) the Codex Security (?:workbench|scan):/u, 'Codex Security workbench command failed'],
            [/^The Codex Security workbench returned invalid JSON\./u, 'Codex Security workbench returned invalid JSON'],
            [/^The Codex Security workbench returned an invalid scan registration\./u, 'Codex Security workbench returned an invalid registration response'],
            [/^The Codex Security scan turn failed without a readable error message\./u, 'Codex scan turn failed without a readable error'],
            [/^The custom validation turn did not complete\./u, 'custom validation turn did not complete'],
            [/\b(?:context_length_exceeded|context_window_exceeded)\b/u, 'scan runtime context limit exceeded'],
            [/\b(?:invalid_request_error|unsupported_parameter)\b/u, 'scan runtime request rejected'],
            [/\b(?:invalid_api_key|authentication_error)\b/u, 'scan runtime authentication rejected'],
            [/\b(?:model_not_found|unsupported_model)\b/u, 'scan runtime model unavailable'],
            [/\b(?:permission_denied|insufficient_permissions)\b/u, 'scan runtime access denied'],
            [/\b(?:insufficient_quota|rate_limit_exceeded)\b/u, 'scan runtime rate or quota limit'],
            [/\b(?:server_error|service_unavailable)\b/u, 'scan runtime upstream service error'],
          ];
          const sessionErrorCategories = new Map([
            ['context_window_exceeded', 'scan runtime context limit exceeded'],
            ['session_budget_exceeded', 'scan session budget exceeded'],
            ['usage_limit_exceeded', 'scan runtime usage limit exceeded'],
            ['rate_limit_exceeded', 'scan runtime rate limit exceeded'],
            ['server_overloaded', 'scan runtime service overloaded'],
            ['model_not_found', 'scan runtime model unavailable'],
            ['policy_capacity_unavailable', 'scan runtime policy-restricted route unavailable'],
            ['cyber_policy', 'scan request blocked by the cybersecurity policy'],
            ['misalignment_policy_violation', 'scan request blocked by a safety policy'],
            ['internal_server_error', 'scan runtime upstream service error'],
            ['unauthorized', 'scan runtime authentication rejected'],
            ['bad_request', 'scan runtime request rejected'],
            ['invalid_prompt', 'scan runtime rejected the prompt'],
            ['sandbox_error', 'scan runtime sandbox error'],
            ['http_connection_failed', 'scan runtime HTTP connection failed'],
            ['response_stream_connection_failed', 'scan runtime could not connect to the response stream'],
            ['response_stream_disconnected', 'scan runtime response stream disconnected'],
            ['response_too_many_failed_attempts', 'scan runtime exhausted response retries'],
          ]);
          // Classify Codex rollout events without copying messages or IDs to the Summary.
          const sessionErrorCategory = (error) => {
            const info = error?.codex_error_info;
            const kind = typeof info === 'string' ? info : Object.keys(info ?? {})[0];
            const category = sessionErrorCategories.get(kind);
            const httpReason = httpCategories.get(info?.[kind]?.http_status_code);
            return category && (httpReason ? `${category} (${httpReason})` : category);
          };
          const reportFailure = (stage, error, context = '', sessionReason) => {
            let reason;
            let errorCategory;
            let turnFailed = false;
            for (let cause = error, depth = 0; cause && depth < 5; cause = cause.cause, depth++) {
              const message = typeof cause === 'string' ? cause : cause.message;
              const nativeStatus = typeof message === 'string'
                ? /(?:^|\n)(?:Error: )?unexpected status (\d{3})\b/u.exec(message)?.[1]
                : undefined;
              const httpReason = httpCategories.get(Number(cause.status ?? cause.statusCode ?? cause.response?.status))
                ?? httpCategories.get(Number(nativeStatus));
              if (httpReason) {
                reason = httpReason;
                break;
              }
              errorCategory ??= errorCategories.get(cause.name) ?? errorCategories.get(cause.code);
              // The pinned SDK wraps failed Codex turns via this function and preserves the cause.
              turnFailed ||= typeof cause.stack === 'string' && /^\s+at codexTurnError \(/mu.test(cause.stack);
              reason ??= messageCategories.find(([pattern]) => [cause.code, message].some(
                (value) => typeof value === 'string' && pattern.test(value),
              ))?.[1];
            }
            reason ??= sessionReason ?? errorCategory;
            const summary = reason ?? (turnFailed ? 'Codex turn failed without a recognized error category' : 'no safe diagnostic available');
            annotate('error', `Codex Security failed during ${stage}: ${summary}.${context}`);
            process.exitCode = 1;
            return reason !== undefined;
          };
          const probeOpenAI = async ({ model, reasoningEffort }, reasoningSummary) => {
            let status;
            let outcome;
            try {
              const reasoning = { effort: reasoningEffort };
              if (reasoningSummary && reasoningSummary !== 'none') reasoning.summary = reasoningSummary;
              const response = await fetch('https://api.openai.com/v1/responses', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY.trim()}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ model, reasoning, input: 'Reply with OK.', max_output_tokens: 512, store: false }),
                redirect: 'error',
                signal: AbortSignal.timeout(30000),
              });
              status = response.status;
              const body = await response.json().catch(() => null);
              if (['completed', 'failed', 'incomplete'].includes(body?.status)) outcome = body.status;
            } catch (error) {
              const reason = error?.name === 'TimeoutError' ? 'timed out' : 'no HTTP response';
              annotate('warning', `Source-free OpenAI API probe: ${reason}.`);
              return;
            }
            annotate('notice', `Source-free OpenAI API probe with scan reasoning settings: HTTP ${status}${outcome ? `, response ${outcome}` : ''}.`);
          };

          const options = {
            auth: 'api-key',
            mode: 'standard',
            target: ['src'],
            outputDir: join(process.env.RUNNER_TEMP, 'codex-security-results'),
            scanPrompt: 'Use static source review only. Do not run repository code, create exploits, or send requests to application endpoints.',
            validationPrompt: 'Validate using static code evidence only. Do not create or execute exploit reproductions.',
          };

          let security;
          let preflight;
          let reasoningSummary;
          let stage = 'SDK initialization';
          let scanMilestone = 'none reported';
          let scanPhase;
          let reconnectReason;
          let trustedAccess;
          let sessionReason;
          const phases = new Set(['preflight', 'threat_model', 'discovery', 'validation', 'attack_path', 'reporting']);
          const reconnectReasons = new Set(['rate_limit', 'network', 'authentication', 'authorization']);
          try {
            const { CodexSecurity, DEFAULT_CODEX_CONFIG } = await import('@openai/codex-security');
            reasoningSummary = DEFAULT_CODEX_CONFIG.model_reasoning_summary;
            security = new CodexSecurity({
              codexOverrides: {
                approval_policy: 'never',
                analytics: { enabled: false },
              },
            });
            // Preflight checks local inputs only; live authentication is checked by run().
            stage = 'local preflight';
            preflight = await security.preflight(process.env.GITHUB_WORKSPACE, { ...options, auth: 'auto' });
            summarize('Codex Security: local preflight passed for `src`; OpenAI API access was not tested by preflight.');

            if (runScan) {
              stage = 'live scan';
              const result = await security.run(process.env.GITHUB_WORKSPACE, {
                ...options,
                onAuthentication() { scanMilestone = 'authentication method selected'; },
                onOutputDirReady() { scanMilestone = 'scan output directory ready'; },
                onLifecycle(snapshot) {
                  if (snapshot.status === 'running') scanMilestone = 'scan registered';
                },
                onScanStarted() { scanMilestone = 'scan session started'; },
                onProgress({ phase }) {
                  if (phases.has(phase)) scanPhase = phase;
                },
                onSessionEvent({ parentThreadId, event }) {
                  if (parentThreadId !== null || event.type !== 'event_msg') return;
                  const payload = event.payload;
                  if (payload?.type === 'task_started') sessionReason = undefined;
                  if (payload?.type === 'error') sessionReason = sessionErrorCategory(payload) ?? sessionReason;
                  if (payload?.type === 'task_complete') {
                    sessionReason = payload.error ? sessionErrorCategory(payload.error) ?? sessionReason : undefined;
                  }
                },
                onReconnect(_attempt, _maxAttempts, details) {
                  if (reconnectReasons.has(details?.reason)) reconnectReason = details.reason;
                },
                onTrustedAccessStatus(status) {
                  if (status === 'granted' || status === 'not_granted' || status === 'unknown') {
                    trustedAccess = status;
                  }
                },
              });
              if (result.manifest.scan.status !== 'completed') {
                reportFailure(stage, { name: 'IncompleteScanError' });
              } else {
                summarize(`Codex Security: scan completed for requested scope \`src\`; reported findings: ${result.findings.findings.length}.`);
                if (process.env.UPLOAD_REPORT === 'true') {
                  stage = 'report preparation';
                  copyFileSync(result.reportPath, join(process.env.RUNNER_TEMP, 'codex-security-report.md'));
                }
              }
            }
          } catch (error) {
            const context = stage === 'live scan'
              ? [
                  ` Last SDK milestone: ${scanMilestone}.`,
                  scanPhase && ` Last scan phase: ${scanPhase}.`,
                  reconnectReason && ` Last reconnect reason: ${reconnectReason}.`,
                  trustedAccess && ` Trusted Access: ${trustedAccess}.`,
                ].filter(Boolean).join('')
              : '';
            const hasDiagnostic = reportFailure(stage, error, context, sessionReason);
            if (stage === 'live scan' && !hasDiagnostic && preflight?.model) {
              await probeOpenAI(preflight, reasoningSummary);
            }
          } finally {
            try {
              await security?.close();
            } catch (error) {
              reportFailure('SDK cleanup', error);
            }
          }
          JS

          # Scanner diagnostics can contain source or credential material; keep them off the Actions log.
          node "$RUNNER_TEMP/codex-security/scan.mjs" 3>&1 > "$RUNNER_TEMP/codex-security.log" 2>&1

      - name: Upload Markdown report (opt-in)
        if: ${{ inputs.run_scan && inputs.upload_report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-security-report
          path: ${{ runner.temp }}/codex-security-report.md
          if-no-files-found: error
          retention-days: 7
