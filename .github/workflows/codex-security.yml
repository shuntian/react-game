name: Codex Security Scan

on:
  workflow_dispatch:
    inputs:
      upload_report:
        description: 'Upload scan reports, which may contain source excerpts and findings'
        type: boolean
        default: false
  schedule:
    - cron: '0 1 * * 1' # UTC 周一 01:00，北京时间周一 09:00

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan the repository
        id: scan
        uses: openai/codex-security@02c70601a70dde2d1c9c9867d4ead298370890d1 # action-v0.11.0
        with:
          scope: repository
          mode: standard
          fail-on-severity: none
          verbose: 'false'
          annotations: 'false'
          summary: 'false'
          upload-artifacts: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_report }}
          artifact-name: codex-security-report
          retention-days: '30'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Summarize scan
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.scan-status }}
          SCANNED_SHA: ${{ steps.scan.outputs.scanned-sha }}
          REPORT_STATUS: ${{ steps.scan.outputs.report-status }}
          CRITICAL: ${{ steps.scan.outputs.critical-count }}
          HIGH: ${{ steps.scan.outputs.high-count }}
          MEDIUM: ${{ steps.scan.outputs.medium-count }}
          LOW: ${{ steps.scan.outputs.low-count }}
          INFO: ${{ steps.scan.outputs.informational-count }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Scan: ${SCAN_STATUS:-unavailable} · Commit: ${SCANNED_SHA:-unavailable} · Reports: ${REPORT_STATUS:-unavailable}

          | Critical | High | Medium | Low | Informational |
          | --- | --- | --- | --- | --- |
          | ${CRITICAL:-—} | ${HIGH:-—} | ${MEDIUM:-—} | ${LOW:-—} | ${INFO:-—} |
          EOF

          if [[ "$SCAN_STATUS" != completed ]]; then
            echo "::error::The repository scan did not complete."
            exit 1
          fi
          if [[ "$SCANNED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::The scan did not report the triggering commit."
            exit 1
          fi
