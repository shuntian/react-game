name: Codex Security Scan

on:
  workflow_dispatch: # 手动测试用（Actions 页面点 Run workflow）
  push:
    branches: [main] # 只在主分支处理

permissions:
  contents: read # 只需读代码，无需写权限

jobs:
  security-scan:
    runs-on: ubuntu-latest
    env:
      # 扫描结果落盘到 workspace，方便后续定位 report.md 并打包下载
      CODEX_SECURITY_STATE_DIR: ${{ github.workspace }}/.codex-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Codex CLI
        # 注：安装命令以 Codex 官方安装文档为准，此处为常见方式
        run: npm install -g @openai/codex

      - name: Authenticate
        run: printenv OPENAI_API_KEY | codex login --with-api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Codex Security scan
        # --dangerously-bypass-approvals-and-sandbox 用于 CI 这种外部隔离环境，
        # 避免 agent 卡在命令确认；GitHub Actions runner 本身就是隔离沙箱
        run: |
          codex exec \
            --cd "$GITHUB_WORKSPACE" \
            --dangerously-bypass-approvals-and-sandbox \
            "Run a Codex Security scan on this repository."
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Show report in logs and Job Summary
        run: |
          REPORT="$(find "$CODEX_SECURITY_STATE_DIR" -name report.md | head -1)"
          if [ -z "$REPORT" ]; then
            echo "::warning::未找到 report.md，扫描结果目录可能为空" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "=== Codex Security Report ==="
          cat "$REPORT"
          echo "--- 报告已写入 Job Summary ---"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-security-report
          path: .codex-security/
          retention-days: 30 # 1–90 天，公开仓库默认 90，可按需调整
